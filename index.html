<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🐙Images → CPP</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔃</text></svg>">
  <style>
    :root {
      --bg: #0b1020;
      --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1e293b 0%, transparent 60%), radial-gradient(1000px 600px at 110% 10%, #0f2a4a 0%, transparent 55%), #0b1020;
      --panel: rgba(20, 29, 48, 0.72);
      --panel-2: rgba(15, 23, 42, 0.6);
      --panel-border: rgba(148, 163, 184, 0.14);
      --ink: #f1f5f9;
      --mute: #94a3b8;
      --line: #2a3550;
      --acc: #4f8cff;
      --acc-hover: #3b7bf0;
      --acc-soft: rgba(79, 140, 255, 0.12);
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.1);
      --bad: #f87171;
      --bad-soft: rgba(248, 113, 113, 0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.6);
      --ring: 0 0 0 3px rgba(79, 140, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--ink);
      font: 15px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      padding: 28px 18px 48px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    header {
      text-align: left;
      padding: 4px 2px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--ink), var(--acc));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    @media(min-width:768px) {
      .app-grid {
        grid-template-columns: 1.15fr 0.85fr;
        align-items: start;
      }
    }

    section {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 22px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    section:hover {
      border-color: rgba(148, 163, 184, 0.28);
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.01em;
    }

    h2::before {
      content: "";
      width: 4px;
      height: 16px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--acc), transparent);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--mute);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    .note {
      font-size: 11px;
      color: var(--mute);
      display: block;
      margin-top: 5px;
      opacity: 0.75;
    }

    input,
    select,
    button {
      font: inherit;
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input[type="color"] {
      padding: 3px;
      height: 40px;
      cursor: pointer;
    }

    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--acc);
    }

    input:hover,
    select:hover {
      border-color: rgba(148, 163, 184, 0.4);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: var(--ring);
      background: var(--panel);
    }

    input[type="file"] {
      padding: 9px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      border: 0;
      background: var(--acc-soft);
      color: var(--acc);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 12px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: rgba(79, 140, 255, 0.22);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      background: var(--panel-2);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    .tab-btn {
      background: transparent;
      border: 0;
      color: var(--mute);
      padding: 9px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      margin-top: 0;
    }

    .tab-btn.active {
      background: var(--acc);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79, 140, 255, 0.3);
    }

    .mode-content {
      display: none;
    }

    .mode-content.active {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .crop-btn-trigger {
      background: linear-gradient(135deg, rgba(79, 140, 255, 0.2), rgba(79, 140, 255, 0.05));
      border: 1px solid var(--acc);
      color: #fff;
      font-weight: 700;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      margin-top: 14px;
    }

    .crop-btn-trigger:hover:not(:disabled) {
      background: var(--acc);
      box-shadow: 0 4px 16px rgba(79, 140, 255, 0.4);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 9, 20, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: translateY(12px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--mute);
      font-size: 20px;
      cursor: pointer;
      width: auto;
      padding: 0 4px;
      line-height: 1;
    }

    .close-modal-btn:hover {
      color: var(--ink);
    }

    .crop-container {
      position: relative;
      width: 100%;
      max-width: 280px;
      height: 280px;
      margin: 10px auto 6px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    .crop-container:active {
      cursor: grabbing;
    }

    canvas#crop-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .crop-overlay-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--mute);
    }

    .status-badge.processing {
      border-color: var(--acc);
      color: var(--acc);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mute);
    }

    .status-badge.processing .status-dot {
      background: var(--acc);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.3;
      }

      to {
        opacity: 1;
      }
    }

    button.primary-btn {
      background: linear-gradient(180deg, var(--acc), var(--acc-hover));
      color: #fff;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
      padding: 13px;
      border-radius: var(--radius-sm);
      box-shadow: 0 6px 20px -6px rgba(79, 140, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      letter-spacing: 0.01em;
    }

    button.primary-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px -8px rgba(79, 140, 255, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    button.primary-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    button.alt {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 600;
    }

    button.alt:hover:not(:disabled) {
      background: var(--acc-soft);
      border-color: var(--acc);
      color: var(--acc);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
      transform: none !important;
    }

    .stage-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0 20px;
    }

    .stage {
      display: grid;
      place-items: center;
      background: #000;
      border-radius: 50%;
      width: 210px;
      height: 210px;
      overflow: hidden;
      box-shadow: 0 0 0 5px var(--line), 0 0 0 6px var(--panel-border), 0 18px 40px -12px rgba(0, 0, 0, 0.7);
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 14px 0 6px;
    }

    td {
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      color: var(--mute);
    }

    td:last-child {
      text-align: right;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    #msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      min-width: 320px;
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      animation: fadeInDown 0.3s ease;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translate(-50%, -10px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .msg-close-btn {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0.7;
      transition: opacity 0.2s;
      width: auto;
    }

    .msg-close-btn:hover {
      opacity: 1;
    }

    .ok {
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .bad {
      background: var(--bad-soft);
      color: var(--bad);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    @media(max-width:480px) {
      body {
        padding: 18px 12px 36px;
      }

      section {
        padding: 18px;
        border-radius: 14px;
      }

      h1 {
        font-size: 22px;
      }

      .stage {
        width: 170px;
        height: 170px;
      }

      .crop-container {
        max-width: 240px;
        height: 240px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1 style="margin-bottom:0px">Images → CPP</h1>
      <p style="margin:0px;font-size:0.6rem;">KRAKEN_GAUGE</p>
    </header>
    <div id="msg" role="status"></div>
    <div class="app-grid">
      <section>
        <h2>1. เลือกรูปแบบและตั้งค่า</h2>
        <div class="mode-tabs">
          <button id="tab-gif" class="tab-btn active" onclick="switchMode('gif')">GIF</button>
          <button id="tab-img" class="tab-btn" onclick="switchMode('img')">Picture</button>
        </div>
        <div id="general-settings-container">
          <div id="mode-gif-box" class="mode-content active">
            <label for="file">เลือกไฟล์ GIF</label>
            <input id="file" type="file" accept="image/gif">
          </div>
          <div id="mode-img-box" class="mode-content">
            <label for="files">เลือกภาพนิ่ง (สูงสุด 5 ภาพ)</label>
            <input id="files" type="file" accept="image/*" multiple>
            <span class="note">ระบบจะนำภาพที่เลือกมาทำเป็นสไลด์โชว์</span>
          </div>
          <button id="btn-open-crop" class="crop-btn-trigger" onclick="openCropModal()" disabled>Crop &
            Position</button>
          <div class="form-grid">
            <div id="gif-opts-1">
              <label for="fstart">เฟรมเริ่มต้น</label>
              <input id="fstart" type="number" value="1" min="1">
            </div>
            <div id="gif-opts-2">
              <label for="fend">เฟรมสิ้นสุด <span style="font-weight:normal">(0=สุดท้าย)</span></label>
              <input id="fend" type="number" value="0" min="0">
            </div>
            <div id="gif-opts-3">
              <label for="skip">ข้ามเฟรมทุกๆ N</label>
              <select id="skip">
                <option value="0">ไม่ข้าม</option>
                <option value="2" selected>ทุกเฟรมที่ 2</option>
                <option value="3">ทุกเฟรมที่ 3</option>
                <option value="4">ทุกเฟรมที่ 4</option>
                <option value="5">ทุกเฟรมที่ 5</option>
              </select>
            </div>
            <div id="delay-gif-box">
              <label for="fdelay">Delay time <span id="fps-label" style="color:var(--acc);font-weight:700;">(10
                  FPS)</span></label>
              <input id="fdelay" type="number" value="10" min="1" placeholder="10 = 0.1 วิ">
              <span class="note">หน่วย 1/100 วิ</span>
            </div>
            <div id="delay-img-box" style="display:none;">
              <label for="sdelay">Slide Delay (Sec)</label>
              <input id="sdelay" type="number" value="10" min="1" placeholder="10 = 10 วินาที">
              <span class="note">สลับภาพทุกๆ (วินาที)</span>
            </div>
            <div>
              <label for="size">ขนาดสูงสุด (px)</label>
              <select id="size">
                <option value="240" selected>240 (เต็มจอ)</option>
                <option value="200">200</option>
                <option value="160">160</option>
                <option value="120">120</option>
                <option value="0">ขนาดเดิม</option>
              </select>
            </div>
            <div>
              <label for="cols">จำนวนสี</label>
              <select id="cols">
                <option value="255">256 สี</option>
                <option value="127">128 สี</option>
                <option value="63" selected>64 สี</option>
                <option value="31">32 สี</option>
                <option value="15">16 สี</option>
              </select>
            </div>
          </div>
          <div class="form-grid" style="margin-top:12px;">
            <div>
              <label for="bg-type">สีพื้นหลังส่วนเกิน</label>
              <select id="bg-type" onchange="toggleBgCustomColor()">
                <option value="black" selected>สีดำ (#000000)</option>
                <option value="white">สีขาว (#FFFFFF)</option>
                <option value="transparent">โปร่งใส</option>
                <option value="custom">กำหนดสีเอง</option>
              </select>
              <div id="custom-color-box" style="display:none;margin-top:8px;">
                <input type="color" id="bg-color" value="#000000">
              </div>
            </div>
            <div>
              <label for="anim-mode">รูปแบบการเล่นแอนิเมชัน</label>
              <select id="anim-mode">
                <option value="normal" selected>Normal</option>
                <option value="pingpong">Loop (Ping-Pong)</option>
              </select>
            </div>
          </div>
          <div style="margin-top:16px;">
            <label for="vname">ชื่อตัวแปร (สำหรับไฟล์ .h)</label>
            <input id="vname" value="Kraken_GIF">
          </div>
        </div>
      </section>
      <div id="res-container" style="display:flex;flex-direction:column;gap:22px;">
        <section id="res">
          <h2>2. ผลลัพธ์และพรีวิว <span id="live-status" class="status-badge" style="margin-left:auto;"><span
                class="status-dot"></span><span id="status-text">พร้อมใช้งาน</span></span></h2>
          <div class="stage-container">
            <div class="stage"><img id="prev" alt="พรีวิว"></div>
          </div>
          <table>
            <tr>
              <td>ขนาดต้นฉบับรวม</td>
              <td id="s0">-</td>
            </tr>
            <tr>
              <td>ขนาดหลังแปลง</td>
              <td id="s1">-</td>
            </tr>
            <tr>
              <td>จำนวนเฟรม / ภาพ</td>
              <td id="s2">-</td>
            </tr>
            <tr>
              <td>ความกว้าง × สูง</td>
              <td id="s3">-</td>
            </tr>
            <tr>
              <td>ขนาดไฟล์ C (.h)</td>
              <td id="s4">-</td>
            </tr>
          </table>
          <div class="form-grid" style="margin-top:12px;">
            <button class="alt" id="dlh" disabled>ดาวน์โหลด .h</button>
            <button class="alt" id="dlgif" disabled>ดาวน์โหลด .gif</button>
          </div>
        </section>
      </div>
    </div>
  </main>
  <div id="crop-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>ปรับตำแหน่งและ Crop</h3>
        <button class="close-modal-btn" onclick="closeCropModal()">✕</button>
      </div>
      <div id="crop-selector-container" style="margin-bottom:12px;display:none;">
        <label for="crop-img-select">เลือกรูปภาพที่จะปรับตำแหน่ง:</label>
        <select id="crop-img-select" onchange="switchCropImage(this.value)"></select>
      </div>
      <div class="crop-container" id="crop-box">
        <canvas id="crop-canvas" width="280" height="280"></canvas>
      </div>
      <div class="crop-overlay-info">
        <button class="alt" onclick="resetCropTransform()" style="width:auto;font-size:12px;padding:6px 10px;">↺
          รีเซ็ตสเกล</button>
        <span id="zoom-label" style="font-size:12px;color:var(--mute);">Zoom: 100%</span>
      </div>
      <div style="margin-top:12px;">
        <label for="zoom-slider">Zoom Level</label>
        <input id="zoom-slider" type="range" min="0.2" max="3.0" step="0.01" value="1.0">
      </div>
      <button class="primary-btn" onclick="closeCropModal()" style="margin-top:16px;width:100%;">ตกลง</button>
    </div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const kb = n => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : (n / 1024).toFixed(1) + " KB";
    const tick = () => new Promise(r => setTimeout(r, 0));
    let currentMode = 'gif',
      rawFrames = [],
      loadedOrigW = 240,
      loadedOrigH = 240;
    let imageTransforms = [];
    let currentCropIndex = 0;
    let processDebounceTimer = null,
      out = null,
      outInfo = null,
      prevUrl = null;

    function setStatus(text, isProcessing = false) {
      const badge = $("live-status");
      $("status-text").textContent = text;
      if (isProcessing) badge.classList.add("processing");
      else badge.classList.remove("processing");
    }

    function switchMode(mode) {
      currentMode = mode;
      $("tab-gif").className = "tab-btn " + (mode === 'gif' ? 'active' : '');
      $("tab-img").className = "tab-btn " + (mode === 'img' ? 'active' : '');
      $("mode-gif-box").className = "mode-content " + (mode === 'gif' ? 'active' : '');

    function openCropModal() {
      if (!rawFrames || !rawFrames.length) return;

    function loadCurrentTransformToUI() {
      const tr = imageTransforms[currentCropIndex] || {

    const cropCanvas = $("crop-canvas"),

    function resetCropTransform() {
      const f = rawFrames[currentCropIndex] || rawFrames[0];
      const fW = f.w || loadedOrigW;
      const fH = f.h || loadedOrigH;
      const W = cropCanvas.width,
        H = cropCanvas.height;
      const coverScale = Math.max(W / fW, H / fH);
      imageTransforms[currentCropIndex] = {
        x: 0,
        y: 0,
        zoom: coverScale
      };
      loadCurrentTransformToUI();
      drawCropGuide();
      triggerLiveUpdate();

    function drawCropGuide() {
      const W = cropCanvas.width,
        H = cropCanvas.height;
      cropCtx.clearRect(0, 0, W, H);
      const f = rawFrames[currentCropIndex] || rawFrames[0];
      if (!f) return;
      const fW = f.w || loadedOrigW;
      const fH = f.h || loadedOrigH;
      const tr = imageTransforms[currentCropIndex] || {
        x: 0,
        y: 0,
        zoom: 1.0
      };
      if (f.rgba) {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = fW;
        tempCanvas.height = fH;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.putImageData(new ImageData(f.rgba, fW, fH), 0, 0);
        cropCtx.save();
        cropCtx.translate(W / 2 + tr.x, H / 2 + tr.y);
        const drawW = fW * tr.zoom,
          drawH = fH * tr.zoom;
        cropCtx.drawImage(tempCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
        cropCtx.restore();
      }
      cropCtx.save();
      cropCtx.fillStyle = "rgba(11,16,32,0.75)";
      cropCtx.beginPath();
      cropCtx.rect(0, 0, W, H);
      cropCtx.arc(W / 2, H / 2, W / 2, 0, Math.PI * 2, true);
      cropCtx.fill();
      cropCtx.strokeStyle = "#4f8cff";
      cropCtx.lineWidth = 2;
      cropCtx.setLineDash([5, 5]);
      cropCtx.beginPath();
      cropCtx.arc(W / 2, H / 2, W / 2, 0, Math.PI * 2);
      cropCtx.stroke();
      cropCtx.restore();
    }
    const cropBox = $("crop-box");
    let isDragging = false,
      startDragX = 0,
      startDragY = 0;
    let initialPinchDist = 0,
      initialZoom = 1.0;

    cropBox.addEventListener("mousedown", e => {
      isDragging = true;
      const tr = imageTransforms[currentCropIndex] || {
        x: 0,
        y: 0,
        zoom: 1.0
      };
      startDragX = e.clientX - tr.x;
      startDragY = e.clientY - tr.y;
    });
    window.addEventListener("mousemove", e => {
      if (!isDragging) return;
      if (!imageTransforms[currentCropIndex]) imageTransforms[currentCropIndex] = {
        x: 0,
        y: 0,
        zoom: 1.0
      };
      imageTransforms[currentCropIndex].x = e.clientX - startDragX;
      imageTransforms[currentCropIndex].y = e.clientY - startDragY;

      triggerLiveUpdate();
    });
    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    cropBox.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        isDragging = true;
        const tr = imageTransforms[currentCropIndex] || {
          x: 0,
          y: 0,
          zoom: 1.0
        };
        startDragX = e.touches[0].clientX - tr.x;
        startDragY = e.touches[0].clientY - tr.y;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = imageTransforms[currentCropIndex] ?.zoom || 1.0;
      }
    }, {
      passive: false
    });

    cropBox.addEventListener("touchmove", e => {
      e.preventDefault();
      if (isDragging && e.touches.length === 1) {
        if (!imageTransforms[currentCropIndex]) imageTransforms[currentCropIndex] = {
          x: 0,
          y: 0,
          zoom: 1.0
        };
        imageTransforms[currentCropIndex].x = e.touches[0].clientX - startDragX;
        imageTransforms[currentCropIndex].y = e.touches[0].clientY - startDragY;
        drawCropGuide();
        triggerLiveUpdate();
      } else if (e.touches.length === 2 && initialPinchDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDist;
        let zoom = Math.max(0.1, Math.min(5.0, initialZoom * factor));
        if (!imageTransforms[currentCropIndex]) imageTransforms[currentCropIndex] = {
          x: 0,
          y: 0,
          zoom: 1.0
        };
        imageTransforms[currentCropIndex].zoom = zoom;
        loadCurrentTransformToUI();
        drawCropGuide();
        triggerLiveUpdate();
      }
    }, {
      passive: false
    });

    cropBox.addEventListener("touchend", e => {
      if (e.touches.length < 2) initialPinchDist = 0;
      if (e.touches.length === 0) isDragging = false;

    cropBox.addEventListener("wheel", e => {
      e.preventDefault();

        x: 0,
        y: 0,
        zoom: 1.0
      };
      let zoom = imageTransforms[currentCropIndex].zoom - e.deltaY * 0.0015;
      zoom = Math.max(0.1, Math.min(5.0, zoom));

      loadCurrentTransformToUI();
      drawCropGuide();
      triggerLiveUpdate();

      passive: false
    });

    $("zoom-slider").oninput = e => {

    async function onSourceFileChanged() {
      try {
        if (currentMode === 'gif') {
          const f = $("file").files[0];
          if (!f) return;
          setStatus("กำลังถอดรหัส GIF...", true);
          await tick();
          const g = parseGIF(await f.arrayBuffer());
          loadedOrigW = g.W;
          loadedOrigH = g.H;
          rawFrames = composeFrames(g);
          const W = cropCanvas.width,
            H = cropCanvas.height;

            x: 0,

          }));

          setStatus("กำลังโหลดรูปภาพ...", true);
          await tick();
          const secVal = +$("sdelay").value || 10;
          const slideshow = await loadImagesAsFrames(files, secVal * 100);
          loadedOrigW = slideshow.W;
          loadedOrigH = slideshow.H;
          rawFrames = slideshow.frames;
          const W = cropCanvas.width,
            H = cropCanvas.height;
          imageTransforms = rawFrames.map(f => {
            const coverScale = Math.max(W / (f.w || loadedOrigW), H / (f.h || loadedOrigH));

    function scaleFrames(frames, origW, origH, userTargetSize) {
      const bgType = $("bg-type").value;
      let bgFillStyle = "transparent";
      if (bgType === 'black') bgFillStyle = "#000000";
      else if (bgType === 'white') bgFillStyle = "#ffffff";
      else if (bgType === 'custom') bgFillStyle = $("bg-color").value;
      const targetSize = userTargetSize > 0 ? userTargetSize : Math.max(origW, origH);
      const srcCanvas = document.createElement("canvas");
      const srcCtx = srcCanvas.getContext("2d");
      const dstCanvas = document.createElement("canvas");
      dstCanvas.width = targetSize;
      dstCanvas.height = targetSize;
      const dstCtx = dstCanvas.getContext("2d", {
        willReadFrequently: true
      });
      dstCtx.imageSmoothingEnabled = true;
      dstCtx.imageSmoothingQuality = "high";
      const cropStageSize = 280,
        scaleRatio = targetSize / cropStageSize;
      return {
        w: targetSize,
        h: targetSize,
        frames: frames.map((f, i) => {
          const fW = f.w || origW,
            fH = f.h || origH;
          srcCanvas.width = fW;
          srcCanvas.height = fH;
          srcCtx.putImageData(new ImageData(f.rgba, fW, fH), 0, 0);
          dstCtx.clearRect(0, 0, targetSize, targetSize);
          if (bgFillStyle !== "transparent") {
            dstCtx.fillStyle = bgFillStyle;
            dstCtx.fillRect(0, 0, targetSize, targetSize);
          }
          const tr = (currentMode === 'gif') ? (imageTransforms[0] || {
            x: 0,
            y: 0,
            zoom: 1.0
          }) : (imageTransforms[i] || imageTransforms[0] || {
            x: 0,
            y: 0,
            zoom: 1.0
          });
          const drawW = fW * tr.zoom * scaleRatio;
          const drawH = fH * tr.zoom * scaleRatio;
          const finalX = (targetSize / 2) + (tr.x * scaleRatio) - (drawW / 2);
          const finalY = (targetSize / 2) + (tr.y * scaleRatio) - (drawH / 2);
          dstCtx.drawImage(srcCanvas, 0, 0, fW, fH, finalX, finalY, drawW, drawH);
          return {
            rgba: dstCtx.getImageData(0, 0, targetSize, targetSize).data,
            delay: f.delay
          };
        })
      };
    }

    async function processLive() {
      if (!rawFrames || !rawFrames.length) return;

          .length + " เฟรม";
        $("s3").textContent = loadedOrigW + "×" + loadedOrigH + " → " + sc.w + "×" + sc.h + " px";

      } catch (e) {

    }

    function lzwDecode(data, minCode, size) {
      const out = new Uint8Array(size);
      const clear = 1 << minCode,
        eoi = clear + 1;
      let codeSize = minCode + 1,
        next = eoi + 1;
      const prefix = new Uint16Array(4096),
        suffix = new Uint8Array(4096),
        stack = new Uint8Array(4098);
      let bits = 0,
        nb = 0,
        pos = 0,
        op = 0,
        prev = -1,
        first = 0;
      for (let i = 0; i < clear; i++) suffix[i] = i;
      while (op < size && pos < data.length) {
        while (nb < codeSize && pos < data.length) {
          bits |= data[pos++] << nb;
          nb += 8;
        }
        if (nb < codeSize) break;
        const code = bits & ((1 << codeSize) - 1);
        bits >>= codeSize;
        nb -= codeSize;
        if (code === clear) {
          codeSize = minCode + 1;
          next = eoi + 1;
          prev = -1;
          continue;
        }
        if (code === eoi) break;
        if (prev === -1) {
          out[op++] = suffix[code];
          prev = code;
          first = code;
          continue;
        }
        let c = code,
          sp = 0;
        if (code >= next) {
          stack[sp++] = first;
          c = prev;
        }
        while (c >= clear && c < 4096) {
          stack[sp++] = suffix[c];
          c = prefix[c];
        }
        first = suffix[c];
        stack[sp++] = first;
        while (sp > 0 && op < size) out[op++] = stack[--sp];
        if (next < 4096) {
          prefix[next] = prev;
          suffix[next] = first;
          next++;
          if (next === (1 << codeSize) && codeSize < 12) codeSize++;
        }
        prev = code;
      }
      return out;
    }

    function parseGIF(buf) {
      const d = new Uint8Array(buf);
      if (d[0] !== 0x47 || d[1] !== 0x49 || d[2] !== 0x46) throw new Error("ไม่ใช่ไฟล์ GIF");
      let p = 6;
      const W = d[p] | (d[p + 1] << 8),
        H = d[p + 2] | (d[p + 3] << 8),
        fl = d[p + 4];
      p += 7;
      let gct = null;
      if (fl & 0x80) {
        const n = 2 << (fl & 7);
        gct = d.subarray(p, p + n * 3);
        p += n * 3;
      }
      const frames = [];
      let gce = null;
      while (p < d.length) {
        const b = d[p++];
        if (b === 0x3B) break;
        if (b === 0x21) {
          const label = d[p++];
          if (label === 0xF9) {
            const f = d[p + 1];
            gce = {
              disp: (f >> 2) & 7,
              trans: (f & 1) ? d[p + 4] : -1,
              delay: d[p + 2] | (d[p + 3] << 8)
            };
          }
          while (p < d.length && d[p] !== 0) p += d[p] + 1;
          p++;
        } else if (b === 0x2C) {
          const x = d[p] | (d[p + 1] << 8),
            y = d[p + 2] | (d[p + 3] << 8);
          const w = d[p + 4] | (d[p + 5] << 8),
            h = d[p + 6] | (d[p + 7] << 8),
            f = d[p + 8];
          p += 9;
          let ct = gct;
          if (f & 0x80) {
            const n = 2 << (f & 7);
            ct = d.subarray(p, p + n * 3);
            p += n * 3;
          }
          const minCode = d[p++];
          const chunks = [];
          let total = 0;
          while (p < d.length && d[p] !== 0) {
            const n = d[p++];
            chunks.push(d.subarray(p, p + n));
            total += n;
            p += n;
          }
          p++;
          const data = new Uint8Array(total);
          let o = 0;
          for (const c of chunks) {
            data.set(c, o);
            o += c.length;
          }
          frames.push({
            x,
            y,
            w,
            h,
            ct,
            interlaced: !!(f & 0x40),
            gce,
            idx: lzwDecode(data, minCode, w * h)
          });
          gce = null;
        }
      }
      if (!frames.length) throw new Error("ไม่พบเฟรมในไฟล์ GIF");
      return {
        W,
        H,
        frames
      };
    }

    function composeFrames(g) {
      const {
        W,
        H
      } = g;
      const cur = new Uint8ClampedArray(W * H * 4);
      const out = [];
      for (const f of g.frames) {
        const disp = f.gce ? f.gce.disp : 0;
        const tr = f.gce ? f.gce.trans : -1;
        let delay = f.gce ? f.gce.delay : 10;
        if (delay < 2) delay = 10;
        const snap = disp === 3 ? cur.slice() : null;
        const rowMap = new Int32Array(f.h);
        if (f.interlaced) {
          let r = 0;
          for (const [s, st] of [
              [0, 8],
              [4, 8],
              [2, 4],
              [1, 2]
            ])
            for (let y = s; y < f.h; y += st) rowMap[y] = r++;
        } else
          for (let y = 0; y < f.h; y++) rowMap[y] = y;
        for (let y = 0; y < f.h; y++) {
          const py = f.y + y;
          if (py >= H) continue;
          const src = rowMap[y] * f.w;
          for (let x = 0; x < f.w; x++) {
            const px = f.x + x;
            if (px >= W) continue;
            const ci = f.idx[src + x];
            if (ci === tr) continue;
            const o = (py * W + px) * 4;
            if (f.ct && ci * 3 + 2 < f.ct.length) {
              cur[o] = f.ct[ci * 3];
              cur[o + 1] = f.ct[ci * 3 + 1];
              cur[o + 2] = f.ct[ci * 3 + 2];
              cur[o + 3] = 255;
            }
          }
        }
        out.push({
          rgba: cur.slice(),
          delay
        });
        if (disp === 2) {
          for (let y = f.y; y < Math.min(H, f.y + f.h); y++)
            for (let x = f.x; x < Math.min(W, f.x + f.w); x++) cur.fill(0, (y * W + x) * 4, (y * W + x) * 4 + 4);
        } else if (disp === 3 && snap) cur.set(snap);
      }
      return out;
    }

    function sliceFrames(frames, start, end) {
      const s = Math.max(0, start - 1);
      const e = (end > 0 && end <= frames.length) ? end : frames.length;
      if (s >= e) return frames;
      return frames.slice(s, e);
    }

    function skipFrames(frames, n) {
      if (n < 2) return frames;
      const out = [];
      frames.forEach((f, i) => {
        if ((i + 1) % n === 0 && out.length) out[out.length - 1].delay += f.delay;
        else out.push({
          rgba: f.rgba,
          delay: f.delay
        });
      });
      return out;
    }

    function pingPongFrames(frames) {
      if (frames.length <= 2) return frames;
      const reversed = frames.slice(1, frames.length - 1).reverse().map(f => ({
        rgba: f.rgba,
        delay: f.delay
      }));
      return frames.concat(reversed);
    }

    async function loadImagesAsFrames(fileList, delayTime) {
      const files = Array.from(fileList).slice(0, 5);
      const frames = [];
      const loadedImgs = await Promise.all(files.map(file => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = URL.createObjectURL(file);
        });
      }));
      if (!loadedImgs.length) return {
        W: 240,
        H: 240,
        frames: []
      };
      for (const img of loadedImgs) {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d", {
          willReadFrequently: true
        });
        ctx.clearRect(0, 0, img.width, img.height);
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        frames.push({
          rgba: imgData.data,
          delay: delayTime,
          w: img.width,
          h: img.height
        });
      }
      return {
        W: loadedImgs[0].width,
        H: loadedImgs[0].height,
        frames
      };
    }

    function buildPalette(frames, nColors) {
      const hist = new Uint32Array(32768);
      for (const f of frames) {
        const a = f.rgba,
          step = Math.max(1, Math.floor(a.length / 4 / 40000));
        for (let i = 0; i < a.length; i += 4 * step) {
          const k = a[i + 3] < 128 ? 0 : ((a[i] >> 3) << 10) | ((a[i + 1] >> 3) << 5) | (a[i + 2] >> 3);
          hist[k]++;
        }
      }
      const colors = [];
      for (let i = 0; i < 32768; i++)
        if (hist[i]) colors.push(i);
      const boxes = [colors];
      while (boxes.length < nColors) {
        let bi = -1,
          bs = 1;
        boxes.forEach((b, i) => {
          if (b.length > bs) {
            bs = b.length;
            bi = i;
          }
        });
        if (bi < 0) break;
        const b = boxes[bi];
        const mn = [31, 31, 31],
          mx = [0, 0, 0];
        for (const c of b) {
          const ch = [c >> 10, (c >> 5) & 31, c & 31];
          for (let k = 0; k < 3; k++) {
            if (ch[k] < mn[k]) mn[k] = ch[k];
            if (ch[k] > mx[k]) mx[k] = ch[k];
          }
        }
        const rg = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]];
        const ch = rg[0] >= rg[1] && rg[0] >= rg[2] ? 0 : (rg[1] >= rg[2] ? 1 : 2);
        const sh = [10, 5, 0][ch];
        b.sort((p, q) => ((p >> sh) & 31) - ((q >> sh) & 31));
        let total = 0;
        for (const c of b) total += hist[c];
        let acc = 0,
          k = 0;
        for (; k < b.length - 1; k++) {
          acc += hist[b[k]];
          if (acc >= total / 2) break;
        }
        k = Math.min(k, b.length - 2);
        boxes.splice(bi, 1, b.slice(0, k + 1), b.slice(k + 1));
      }
      const pal = new Uint8Array(boxes.length * 3);
      boxes.forEach((b, i) => {
        let r = 0,
          g = 0,
          bl = 0,
          t = 0;
        for (const c of b) {
          const w = hist[c];
          r += (c >> 10) * w;
          g += ((c >> 5) & 31) * w;
          bl += (c & 31) * w;
          t += w;
        }
        const e = v => {
          v = Math.round(v / t);
          return (v << 3) | (v >> 2);
        };
        pal[i * 3] = e(r);
        pal[i * 3 + 1] = e(g);
        pal[i * 3 + 2] = e(bl);
      });
      return pal;
    }

    function quantizeFrames(frames, pal) {
      const n = pal.length / 3,
        lut = new Int16Array(32768).fill(-1);
      const find = key => {
        const r = ((key >> 10) << 3) | (key >> 12),
          g = (((key >> 5) & 31) << 3) | (((key >> 5) & 31) >> 2),
          b = ((key & 31) << 3) | ((key & 31) >> 2);
        let best = 0,
          bd = 1e9;
        for (let i = 0; i < n; i++) {
          const dr = pal[i * 3] - r,
            dg = pal[i * 3 + 1] - g,
            db = pal[i * 3 + 2] - b;
          const d = dr * dr * 3 + dg * dg * 4 + db * db * 2;
          if (d < bd) {
            bd = d;
            best = i;
          }
        }
        return best;
      };
      return frames.map(f => {
        const a = f.rgba,
          out = new Uint8Array(a.length / 4);
        for (let i = 0, j = 0; j < out.length; i += 4, j++) {
          const key = a[i + 3] < 128 ? 0 : ((a[i] >> 3) << 10) | ((a[i + 1] >> 3) << 5) | (a[i + 2] >> 3);
          let v = lut[key];
          if (v < 0) {
            v = find(key);
            lut[key] = v;
          }
          out[j] = v + 1;
        }
        return out;
      });
    }

    function lzwEncode(idx, minCode) {
      const clear = 1 << minCode,
        eoi = clear + 1;
      const out = [];
      let cur = 0,
        curBits = 0;
      const emit = (code, size) => {
        cur |= code << curBits;
        curBits += size;
        while (curBits >= 8) {
          out.push(cur & 255);
          cur >>= 8;
          curBits -= 8;
        }
      };
      let codeSize = minCode + 1,
        next = eoi + 1,
        dict = new Map();
      emit(clear, codeSize);
      let prefix = idx[0];
      for (let i = 1; i < idx.length; i++) {
        const k = idx[i],
          key = (prefix << 8) | k,
          v = dict.get(key);
        if (v !== undefined) {
          prefix = v;
          continue;
        }
        emit(prefix, codeSize);
        if (next < 4096) {
          dict.set(key, next++);
          if (next > (1 << codeSize) && codeSize < 12) codeSize++;
        } else {
          emit(clear, codeSize);
          dict = new Map();
          codeSize = minCode + 1;
          next = eoi + 1;
        }
        prefix = k;
      }
      emit(prefix, codeSize);
      if (next < 4096) {
        next++;
        if (next > (1 << codeSize) && codeSize < 12) codeSize++;
      }
      emit(eoi, codeSize);
      if (curBits > 0) out.push(cur & 255);
      return out;
    }

    function encodeGIF(w, h, pal, idxFrames, delays) {
      const nCol = pal.length / 3 + 1;
      let bpp = 2;
      while ((1 << bpp) < nCol) bpp++;
      const o = [];
      const u16 = v => o.push(v & 255, (v >> 8) & 255);
      for (const c of "GIF89a") o.push(c.charCodeAt(0));
      u16(w);
      u16(h);
      o.push(0x80 | ((bpp - 1) << 4) | (bpp - 1), 0, 0);
      o.push(0, 0, 0);
      for (let i = 0; i < pal.length; i++) o.push(pal[i]);
      for (let i = nCol * 3; i < (1 << bpp) * 3; i++) o.push(0);
      o.push(0x21, 0xFF, 0x0B);
      for (const c of "NETSCAPE2.0") o.push(c.charCodeAt(0));
      o.push(3, 1, 0, 0, 0);
      for (let i = 0; i < idxFrames.length; i++) {
        const cur = idxFrames[i];
        let x0 = 0,
          y0 = 0,
          bw = w,
          bh = h,
          data = cur,
          trans = false;
        if (i > 0) {
          const prev = idxFrames[i - 1];
          let minx = w,
            miny = h,
            maxx = -1,
            maxy = -1;
          for (let y = 0; y < h; y++) {
            const r = y * w;
            for (let x = 0; x < w; x++)
              if (cur[r + x] !== prev[r + x]) {
                if (x < minx) minx = x;
                if (x > maxx) maxx = x;
                if (y < miny) miny = y;
                if (y > maxy) maxy = y;
              }
          }
          trans = true;
          if (maxx < 0) {
            bw = bh = 1;
            data = new Uint8Array([0]);
          } else {
            x0 = minx;
            y0 = miny;
            bw = maxx - minx + 1;
            bh = maxy - miny + 1;
            data = new Uint8Array(bw * bh);
            for (let y = 0; y < bh; y++)
              for (let x = 0; x < bw; x++) {
                const p = (y0 + y) * w + x0 + x;
                data[y * bw + x] = cur[p] === prev[p] ? 0 : cur[p];
              }
          }
        }
        o.push(0x21, 0xF9, 4, (1 << 2) | (trans ? 1 : 0));
        u16(Math.min(65535, delays[i]));
        o.push(0, 0);
        o.push(0x2C);
        u16(x0);
        u16(y0);
        u16(bw);
        u16(bh);
        o.push(0);
        o.push(bpp);
        const z = lzwEncode(data, bpp);
        for (let p = 0; p < z.length; p += 255) {
          const n = Math.min(255, z.length - p);
          o.push(n);
          for (let k = 0; k < n; k++) o.push(z[p + k]);
        }
        o.push(0);
      }
      o.push(0x3B);
      return new Uint8Array(o);
    }

    function say(t, cls) {
      const m = $("msg");
      if (!t) {
        m.style.display = "none";
        m.textContent = "";
        return;
      }
      m.className = (cls || "") + " ok-bad-box";
      m.innerHTML =
      `<span>${t}</span> <button class="msg-close-btn" onclick="$('msg').style.display='none'">✕</button>`;
      m.className = cls || "";
      m.style.display = "flex";
    }

    $("dlgif").onclick = () => out && download(outInfo.name + ".gif", new Blob([out], {
      type: "image/gif"
    }));
    $("dlh").onclick = () => {
      if (!out) return;
      const n = outInfo.name,
        lines = [];
      for (let i = 0; i < out.length; i += 16)
        lines.push("  " + Array.from(out.subarray(i, i + 16), b => "0x" + b.toString(16).padStart(2, "0")).join(
        ", "));
      const txt = "// " + out.length + " bytes\n#include <stdint.h>\nconst uint8_t " + n + "[] PROGMEM = {\n" +
        lines.join(",\n") + "\n};\nconst unsigned int " + n + "_len = " + out.length + ";\n";
      download(n + ".h", new Blob([txt], {
        type: "text/plain"
      }));
    };

    function download(name, blob) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
